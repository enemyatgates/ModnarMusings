name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or master — adjust depending on your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # fetch Hugo themes if any
          fetch-depth: 0    # required for Hugo .GitInfo and .Lastmod

      - name: 🛠️ Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: 🏗️ Build site
        run: hugo --minify --baseURL "${{ vars.BASE_URL || 'https://enemyatgates.github.io/ModnarMusings/' }}"

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚚 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
